[package]
name = "domainator-genbank-summary-wasm"
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.89"
description = "Self-contained WASM summarizer for Domainator GenBank Summary."

[lib]
crate-type = ["cdylib"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"