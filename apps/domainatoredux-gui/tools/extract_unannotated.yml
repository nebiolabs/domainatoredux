# GUI dialog for `domainatoredux extract_unannotated`. Format: see README.md in this directory.
id: extract_unannotated
label: "Extract unannotated"
description: "Extract the regions of each CDS/contig with no domain annotation."
fields:
  - name: input
    label: "Input sequences"
    file_type: sequence
    sources: workspace_first
    select: first
  - name: genbank_out
    label: "Output"
    output_name: "{stem}.unannotated.gb"
  - name: fasta_out
    label: "Output (FASTA)"
  - name: databases
    label: "Databases"
  - name: annotation_type
    label: "Search hits"
  - name: largest
    label: "Largest only"
  - name: min_length
    label: "Min length"
  - name: keep_direction
    label: "Keep direction"
  - name: keep_name
    label: "Keep name"
  - name: evalue
    label: "Max E-value"
  - name: min_score
    label: "Min score"
  - name: contigs
    label: "Restrict to contigs"
  - name: contigs_file
    show: false
    label: "Contigs file"
