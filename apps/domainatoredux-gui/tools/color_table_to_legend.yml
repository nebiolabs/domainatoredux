# GUI dialog for `domainatoredux color_table_to_legend`. Format: see README.md in this directory.
id: color_table_to_legend
label: "Color table → legend"
description: "Render a color table as an SVG legend."
fields:
  - name: input
    label: "Color table(s)"
    file_type: table
    sources: workspace_first
    select: first
  - name: svg_out
    label: "Output (SVG)"
    output_name: "{stem}.legend.svg"
  - name: title
    label: "Title"
