# GUI dialog for `domainatoredux matrix_report`. Format: see README.md in this directory.
id: matrix_report
label: "Matrix report (export)"
description: "Export a text summary + suggested cutoffs from a similarity matrix."
fields:
  - name: input
    label: "Input matrix"
    file_type: hdf5
    sources: workspace_first
    select: first
  - name: text_out
    label: "Output (text)"
    required: true
    output_name: "{stem}.report.txt"
  - name: html_out
    label: "HTML report (optional)"
    help: "An interactive page that opens in any browser, offline."
  - name: json_out
    show: false
    label: "JSON"
  - name: knn_projection
    show: false
    label: "Project MST + kNN edge counts"
  - name: merge_impact_metric
    show: false
    label: "Merge impact metric"
  - name: max_merge_events
    show: false
    label: "Max merge events"
  - name: progress
    show: false
    label: "Progress"
  - name: profile_stages
    show: false
    label: "Profile stages"
