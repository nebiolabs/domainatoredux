# GUI dialog for `domainatoredux deduplicate_genbank`. Format: see README.md in this directory.
id: deduplicate_genbank
label: "Deduplicate"
description: "Collapse near-identical sequences to representatives (hash, or diamond/cd-hit/usearch backends)."
fields:
  - name: input
    label: "Input sequences"
    file_type: sequence
    sources: workspace_first
    select: first
  - name: genbank_out
    label: "Output (GenBank)"
    output_name: "{stem}.dedup.gb"
  - name: fasta_out
    label: "Output (FASTA)"
  - name: algorithm
    label: "Algorithm"
  - name: identity
    label: "Identity threshold"
  - name: alphabet
    label: "FASTA type"
  - name: both_strands
    label: "Both strands"
  - name: prefix_count
    label: "Prefix count"
  - name: suffix_count
    label: "Suffix count"
  - name: cluster_tsv_out
    label: "Cluster table (out)"
  - name: cluster_sep
    label: "Cluster separator"
  - name: cdhit_args
    label: "cd-hit options"
  - name: usearch_args
    label: "usearch options"
  - name: diamond_args
    label: "diamond options"
  - name: cdhit_path
    show: false
    label: "cd-hit path"
  - name: cdhit_est_path
    show: false
    label: "cd-hit-est path"
  - name: usearch_path
    show: false
    label: "usearch path"
  - name: diamond_path
    show: false
    label: "diamond path"
  - name: log_out
    show: false
    label: "Log"
  - name: cpu
    show: false
    label: "Cpu"
