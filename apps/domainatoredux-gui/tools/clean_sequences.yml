# GUI dialog for `domainatoredux clean_sequences`. Format: see README.md in this directory.
id: clean_sequences
label: "Clean sequences"
description: "Normalize sequences: clean/deduplicate names, strip gaps, filter non-canonical residues."
fields:
  - name: input
    label: "Input sequences"
    file_type: sequence
    sources: workspace_first
    select: first
  - name: genbank_out
    label: "Output"
    output_name: "{stem}.cleaned.gb"
  - name: fasta_out
    label: "Output (FASTA)"
  - name: alphabet
    label: "FASTA type"
  - name: clean_name
    label: "Clean names"
  - name: deduplicate_names
    label: "Deduplicate names"
  - name: strip
    label: "Strip gaps"
  - name: filter_by_aa
    label: "Filter non-canonical"
  - name: log_out
    show: false
    label: "Log"
