# GUI dialog for `domainatoredux domainate`. Format: see README.md in this directory.
id: domainate
label: "Domainate"
description: "Annotate sequences with domains from HMM/FASTA references (step 2)."
fields:
  - name: input
    label: "Input sequences"
    file_type: sequence
    sources: workspace_first
    select: first
  - name: reference
    label: "References (HMM/FASTA)"
    file_type: reference
    sources: databases_first
    select: "database:pfam"
    prefill_priority: 1
  - name: genbank_out
    label: "Output (GenBank)"
    output_name: "{stem}.annotated.gb"
  - name: fasta_out
    label: "Output (FASTA)"
  - name: evalue
    label: "E-value"
  - name: Z
    label: "Z (db size)"
  - name: max_hits_per_cds
    label: "Max hits per CDS"
  - name: max_overlap
    label: "Max overlap"
    gui_default: 0.6
  - name: max_mode
    label: "Max mode"
  - name: gene_call
    label: "Gene calling"
    help: "Call genes with Orphos (Tools → External tools) before searching: all re-calls every nucleotide contig, unannotated only those with no CDS. Set Z too."
  - name: partial
    label: "Fragments"
    help: "Which CDSs/proteins to search, by fragment status: include (all), exclude (skip fragments), only (only fragments). Records are written either way."
  - name: min_evalue
    show: false
    label: "Min evalue"
  - name: overlap_by_db
    show: false
    label: "Overlap by db"
  - name: cpu
    show: false
    label: "Cpu"
  - name: alphabet
    show: false
    label: "Alphabet"
  - name: batch_size
    show: false
    label: "Batch size"
  - name: max_output_gb
    show: false
    label: "Max output (GB)"
  - name: foldseek
    label: "Foldseek databases"
    file_type: foldseek
    sources: databases_first
    select: none
    help: "Structure databases to search too, with each protein's 3Di structure states predicted by ProstT5. Add one in the Databases panel (any of its files); needs foldseek (Tools → External tools) and the ProstT5 model (Reference databases)."
  - name: prostt5_weights
    label: "ProstT5 model"
    file_type: prostt5
    sources: databases_first
    select: "database:prostt5"
    help: "The ProstT5 model foldseek predicts 3Di with, used only with foldseek databases. Download it in the Reference databases panel."
  - name: prostt5_device
    label: "ProstT5 device"
    help: "cpu, or cuda:0 (another CUDA device) to run ProstT5 on a GPU. A GPU needs foldseek's CUDA build (foldseek-linux-gpu), not the one External tools installs."
  - name: foldseek_device
    show: false
    label: "Foldseek device"
  - name: foldseek_path
    show: false
    label: "Foldseek program"
  - name: esm2_3di_weights
    show: false
    label: "ESM-2 3Di weights"
    file_type: text
    sources: workspace_first
    select: none
  - name: esm2_3di_device
    show: false
    label: "ESM-2 3Di device"
