# GUI dialog for `domainatoredux build_ssn`. Format: see README.md in this directory.
id: build_ssn
label: "Build SSN (XGMML)"
description: "Build a Cytoscape XGMML network from a similarity matrix."
fields:
  - name: input
    label: "Input matrix"
    file_type: hdf5
    sources: workspace_first
    select: first
  - name: xgmml_out
    label: "Output (XGMML)"
    output_name: "{stem}.xgmml"
  - name: metadata
    label: "Metadata (TSV)"
    file_type: table
    sources: workspace_first
    select: none
  - name: cluster
    label: "Cluster"
  - name: cluster_tsv_out
    label: "Cluster TSV"
    output_name: "{stem}.clusters.tsv"
  - name: threshold
    label: "Threshold"
  - name: mst
    label: "MST"
  - name: knn
    label: "kNN"
  - name: mark_mst
    label: "Mark MST edges"
  - name: color_by
    label: "Color by"
  - name: color_table
    label: "Color table (in)"
    file_type: table
    sources: workspace_first
    select: none
  - name: color_table_out
    label: "Color table (out)"
  - name: subset
    show: false
    label: "Subset"
  - name: subset_file
    show: false
    label: "Subset file"
  - name: max_color_groups
    show: false
    label: "Max color groups"
  - name: palette_offset
    show: false
    label: "Palette offset"
  - name: no_cluster_header
    show: false
    label: "No cluster header"
  - name: max_output_gb
    show: false
    label: "Max output gb"
