# GUI dialog for `domainatoredux build_ssn`. Format: see README.md in this directory.
id: build_ssn
label: "Build SSN"
description: "Build a sequence similarity network from a similarity matrix: a Domainator Viewer bundle (.dvb) to explore here, and optionally a Cytoscape XGMML file."
fields:
  - name: input
    label: "Input matrix"
    file_type: hdf5
    sources: workspace_first
    select: first
  - name: dvb_out
    label: "Viewer bundle (.dvb)"
    output_name: "{stem}.dvb"
  - name: xgmml_out
    label: "Cytoscape (XGMML)"
  - name: metadata
    label: "Metadata (TSV)"
    file_type: table
    sources: workspace_first
    select: none
  - name: threshold
    label: "Threshold"
  - name: cluster
    label: "Cluster"
  - name: cluster_tsv_out
    label: "Cluster TSV"
  - name: mst
    label: "MST"
  - name: knn
    label: "kNN"
  - name: mark_mst
    label: "Mark MST edges"
  - name: color_by
    label: "Color by"
  - name: label_by
    label: "Label by"
  - name: color_table
    label: "Color table (in)"
    file_type: table
    sources: workspace_first
    select: none
  - name: color_table_out
    label: "Color table (out)"
  - name: merge_impact_metric
    label: "Merge metric"
  - name: html_out
    show: false
    label: "HTML page"
  - name: name
    show: false
    label: "Name"
  - name: categorical
    show: false
    label: "Categorical"
  - name: subset
    show: false
    label: "Subset"
  - name: subset_file
    show: false
    label: "Subset file"
  - name: max_color_groups
    show: false
    label: "Max color groups"
  - name: palette_offset
    show: false
    label: "Palette offset"
  - name: no_cluster_header
    show: false
    label: "No cluster header"
  - name: max_output_gb
    show: false
    label: "Max output gb"
