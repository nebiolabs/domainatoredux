# GUI dialog for `domainatoredux build_tree`. Format: see README.md in this directory.
id: build_tree
label: "Build tree"
description: "Build a UPGMA tree from a distance or similarity matrix, or read a Newick tree, as a Domainator Viewer bundle (.dvb) with an optional alignment beside it."
fields:
  - name: input
    label: "Input matrix"
    file_type: hdf5
    sources: workspace_first
    select: first
  - name: newick
    label: "Or a Newick tree"
    file_type: newick
    sources: workspace_first
    select: none
  - name: dvb_out
    label: "Viewer bundle (.dvb)"
    output_name: "{stem}.tree.dvb"
  - name: newick_out
    label: "Newick"
    output_name: "{stem}.nwk"
  - name: xgmml_out
    label: "Cytoscape (XGMML)"
  - name: msa
    label: "Alignment (aligned FASTA)"
    file_type: [alignment, fasta]
    sources: workspace_first
    select: none
  - name: metadata
    label: "Metadata (TSV)"
    file_type: table
    sources: workspace_first
    select: none
  - name: distance
    label: "Distance"
  - name: color_by
    label: "Color by"
  - name: label_by
    label: "Label by"
  - name: color_table
    label: "Color table (in)"
    file_type: table
    sources: workspace_first
    select: none
  - name: color_table_out
    label: "Color table (out)"
  - name: algorithm
    show: false
    label: "Algorithm"
  - name: html_out
    show: false
    label: "HTML page"
  - name: name
    show: false
    label: "Name"
  - name: categorical
    show: false
    label: "Categorical"
  - name: subset
    show: false
    label: "Subset"
  - name: subset_file
    show: false
    label: "Subset file"
  - name: max_color_groups
    show: false
    label: "Max color groups"
  - name: palette_offset
    show: false
    label: "Palette offset"
  - name: max_output_gb
    show: false
    label: "Max output gb"
