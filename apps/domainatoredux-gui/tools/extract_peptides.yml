# GUI dialog for `domainatoredux extract_peptides`. Format: see README.md in this directory.
id: extract_peptides
label: "Extract peptides"
description: "Extract CDS translations (peptides) by domain/CDS name, search hit, or all."
fields:
  - name: input
    label: "Input sequences"
    file_type: sequence
    sources: workspace_first
    select: first
  - name: genbank_out
    label: "Output"
    output_name: "{stem}.peptides.gb"
  - name: fasta_out
    label: "Output (FASTA)"
  - name: domains
    label: "Domain names"
  - name: cds
    label: "CDS names"
  - name: domain_expr
    label: "Domain expression"
  - name: databases
    label: "Databases"
  - name: unannotated
    label: "Unannotated"
  - name: annotation_type
    label: "Annotation type"
  - name: has_search_hit
    label: "Has search hit"
  - name: strand
    label: "Strand (f/r)"
  - name: invert
    label: "Invert"
  - name: keep_parent_id
    label: "Keep parent ID"
  - name: name_field
    label: "Name field"
  - name: evalue
    label: "Max E-value"
  - name: contigs
    label: "Restrict to contigs"
  - name: partial
    label: "Fragments"
    help: "Which CDSs to extract peptides from, by fragment status. Not affected by Invert."
  - name: include_taxids
    label: "Include taxids"
  - name: exclude_taxids
    label: "Exclude taxids"
  - name: taxonomy_expr
    label: "Taxonomy expr"
  - name: taxonomy_unknown
    label: "Unknown taxonomy"
  - name: ncbi_taxonomy_path
    label: "Taxonomy database"
    file_type: taxonomy
    sources: databases_first
    select: "database:ncbi_taxonomy"
  - name: domains_file
    show: false
    label: "Domains file"
  - name: cds_file
    show: false
    label: "Cdss file"
  - name: contigs_file
    show: false
    label: "Contigs file"
