# GUI dialog for `domainatoredux select_by_contig`. Format: see README.md in this directory.
id: select_by_contig
label: "Select by contig"
description: "Select whole contigs by name/regex, domain content, taxonomy, length, or CDS count."
fields:
  - name: input
    label: "Input sequences"
    file_type: sequence
    sources: workspace_first
    select: first
  - name: genbank_out
    label: "Output (GenBank)"
    output_name: "{stem}.selected.gb"
  - name: fasta_out
    label: "Output (FASTA)"
  - name: contigs
    label: "Contig names"
  - name: contigs_file
    label: "Contigs file (.txt)"
    file_type: text
    sources: workspace_first
    select: none
  - name: contigs_regex
    label: "Contigs regex"
  - name: definition_regex
    label: "Definition regex"
  - name: sequence_regex
    label: "Sequence regex"
  - name: domains
    label: "Domain names"
  - name: domains_file
    label: "Domain names file (.txt)"
    file_type: text
    sources: workspace_first
    select: none
  - name: domain_expr
    label: "Domain expr"
  - name: annotation_type
    label: "Annotation type"
  - name: databases
    label: "Databases"
  - name: unannotated
    label: "Unannotated"
  - name: has_search_hit
    label: "Has search hit"
  - name: evalue
    label: "E-value"
  - name: max_records
    label: "First N"
  - name: min_length
    label: "Length ≥"
  - name: max_length
    label: "Length ≤"
  - name: min_cds
    label: "CDS count ≥"
  - name: max_cds
    label: "CDS count ≤"
  - name: min_search_score
    label: "Search score ≥"
  - name: max_search_score
    label: "Search score ≤"
  - name: invert
    label: "Invert"
  - name: include_taxids
    label: "Include taxids"
  - name: exclude_taxids
    label: "Exclude taxids"
  - name: taxonomy_expr
    label: "Taxonomy expr"
  - name: taxonomy_unknown
    label: "Unknown taxonomy"
  - name: ncbi_taxonomy_path
    label: "Taxonomy database"
    file_type: taxonomy
    sources: databases_first
    select: "database:ncbi_taxonomy"
  - name: taxonomy_update
    # The Databases panel checks and refreshes the managed taxdump and records
    # its version; a job refreshing it in place would bypass that.
    show: false
    label: "Update taxonomy"
  - name: partial
    label: "Fragments"
    help: "Which contigs to select, by fragment status. A nucleotide contig is a fragment if any of its CDSs is. Not affected by Invert."
