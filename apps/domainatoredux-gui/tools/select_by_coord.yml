# GUI dialog for `domainatoredux select_by_coord`. Format: see README.md in this directory.
id: select_by_coord
label: "Select by coordinate"
description: "Extract sub-regions listed in a coordinate table (contig, start, end)."
fields:
  - name: input
    label: "Input sequences"
    file_type: sequence
    sources: workspace_first
    select: first
  - name: coords
    label: "Coordinate table"
    file_type: table
    sources: workspace_first
    select: first
  - name: genbank_out
    label: "Output (GenBank)"
    output_name: "{stem}.bycoord.gb"
  - name: fasta_out
    label: "Output (FASTA)"
