# GUI dialog for `domainatoredux extract_domains`. Format: see README.md in this directory.
id: extract_domains
label: "Extract domains"
description: "Extract annotated domain regions as their own records (GenBank or FASTA)."
fields:
  - name: input
    label: "Input sequences"
    file_type: sequence
    sources: workspace_first
    select: first
  - name: genbank_out
    label: "Output"
    output_name: "{stem}.domains.gb"
  - name: fasta_out
    label: "Output (FASTA)"
  - name: domains
    label: "Domain names"
  - name: databases
    label: "Databases"
  - name: annotation_type
    label: "Search hits"
  - name: evalue
    label: "Max E-value"
  - name: extend_range
    label: "Extend (±)"
  - name: min_score
    label: "Min score"
  - name: extend_up
    label: "Pad upstream"
  - name: extend_down
    label: "Pad downstream"
  - name: combine
    label: "Combine adjacent"
  - name: splice
    label: "Splice"
  - name: keep_direction
    label: "Keep direction"
  - name: keep_name
    label: "Keep name"
  - name: contigs
    label: "Restrict to contigs"
  - name: partial
    label: "Fragments"
    help: "Which domains to extract, by the fragment status of the CDS or protein they are on."
  - name: domains_file
    show: false
    label: "Domains file"
  - name: contigs_file
    show: false
    label: "Contigs file"
