# GUI dialog for `domainatoredux find_features`. Format: see README.md in this directory.
id: find_features
label: "Find features (motifs, TMbed)"
description: "Annotate each protein and CDS with PROSITE motif matches, and transmembrane regions and signal peptides (TMbed)."
fields:
  - name: input
    label: "Input sequences"
    file_type: sequence
    sources: workspace_first
    select: first
  - name: genbank_out
    label: "Output (GenBank)"
    output_name: "{stem}.features.gb"
  - name: fasta_out
    label: "Output (FASTA)"
  - name: motif
    label: "PROSITE motifs"
    help: "One or more PROSITE patterns, comma-separated, e.g. C-x(2)-C, [DE](2)HS{P}. Each match is a Domainator feature named after its pattern."
  - name: tmbed
    label: "TMbed"
    help: "Predict transmembrane beta strands and alpha helices, and signal peptides, with TMbed. Expect a few seconds per protein on a CPU."
  - name: tmbed_model_dir
    label: "TMbed model"
    file_type: prott5
    sources: databases_first
    select: "database:prott5"
    help: "The ProtT5 model TMbed reads. Download it in the Reference databases panel; with none chosen, the first run downloads it (2.4 GB) to your cache folder."
  - name: device
    label: "TMbed device"
    help: "cuda:0 (or another CUDA device, or metal) to run TMbed on a GPU, None for the CPU. A GPU this build or machine lacks falls back to the CPU."
  - name: gene_call
    label: "Gene calling"
    help: "Call genes with Orphos (Tools → External tools) before searching: all re-calls every nucleotide contig, unannotated only those with no CDS."
  - name: partial
    label: "Fragments"
    help: "Which CDSs/proteins to search, by fragment status: include (all), exclude (skip fragments), only (only fragments). Records are written either way."
  - name: alphabet
    show: false
    label: "Alphabet"
  - name: cpu
    show: false
    label: "Cpu"
  - name: batch_size
    show: false
    label: "Batch size"
  - name: model_dir
    show: false
    label: "Model folder"
