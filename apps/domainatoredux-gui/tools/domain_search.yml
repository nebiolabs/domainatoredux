# GUI dialog for `domainatoredux domain_search`. Format: see README.md in this directory.
id: domain_search
label: "Domain search"
description: "Search sequences with HMM/FASTA references and extract hit CDSs or their genomic neighborhoods (step 1)."
fields:
  - name: input
    label: "Input database"
    file_type: sequence
    sources: databases_first
    select: first
  - name: reference
    label: "References (HMM/FASTA)"
    file_type: reference
    sources: workspace_first
    select: none
    prefill_priority: 1
  - name: genbank_out
    label: "Output (GenBank)"
    output_name: "{stem}.search.gb"
  - name: fasta_out
    label: "Output (FASTA)"
  - name: evalue
    label: "E-value"
  - name: max_hits
    label: "Max hits"
    gui_default: 10000000
  - name: Z
    label: "Z (db size)"
  - name: add_annotations
    label: "Add annotations"
  - name: max_mode
    label: "Max mode"
  - name: whole_contig
    label: "Whole contig"
  - name: cds_range
    label: "CDS range (±)"
  - name: cds_up
    label: "CDS upstream"
  - name: cds_down
    label: "CDS downstream"
  - name: kb_range
    label: "kb range (±)"
  - name: kb_up
    label: "kb upstream"
  - name: kb_down
    label: "kb downstream"
  - name: strand
    label: "Strand (f/r)"
  - name: keep_direction
    label: "Keep direction"
  - name: dedup
    label: "Deduplicate"
  - name: translate
    label: "Translate"
  - name: decoys
    label: "Decoy refs"
  - name: decoys_file
    label: "Decoys file (.txt)"
    file_type: text
    sources: workspace_first
    select: none
  - name: include_taxids
    label: "Include taxids"
  - name: exclude_taxids
    label: "Exclude taxids"
  - name: taxonomy_expr
    label: "Taxonomy expr"
  - name: taxonomy_unknown
    label: "Unknown taxonomy"
  - name: ncbi_taxonomy_path
    label: "Taxonomy database"
    file_type: taxonomy
    sources: databases_first
    select: "database:ncbi_taxonomy"
  - name: taxonomy_update
    # The Databases panel checks and refreshes the managed taxdump and records
    # its version; a job refreshing it in place would bypass that.
    show: false
    label: "Update taxonomy"
  - name: gene_call
    label: "Gene calling"
    help: "Call genes with Orphos (Tools → External tools) before searching: all re-calls every nucleotide contig, unannotated only those with no CDS. Set Z too."
  - name: partial
    label: "Fragments"
    help: "Which CDSs/proteins to search, by fragment status: include (all), exclude (skip fragments), only (only fragments)."
  - name: min_evalue
    show: false
    label: "Min evalue"
  - name: max_hits_per_contig
    show: false
    label: "Max hits per contig"
  - name: max_overlap
    show: false
    label: "Max overlap"
  - name: batch_size
    show: false
    label: "Batch size"
  - name: cpu
    show: false
    label: "Cpu"
  - name: alphabet
    show: false
    label: "Alphabet"
  - name: pad
    show: false
    label: "Pad"
  - name: anchor
    label: "Pad anchor"
  - name: max_region_overlap
    show: false
    label: "Max region overlap"
  - name: max_output_gb
    show: false
    label: "Max output gb"
