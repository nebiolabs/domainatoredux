# GUI dialog for `domainatoredux structure_to_genbank`. Format: see README.md in this directory.
id: structure_to_genbank
label: "Structures to GenBank"
description: "One protein record per chain of each PDB/mmCIF structure, so structures work with the sequence tools (needs foldseek)."
fields:
  - name: input
    label: "Structures"
    file_type: structure
    sources: workspace_first
    select: first
  - name: genbank_out
    label: "Output (GenBank)"
    output_name: "{stem}.structures.gb"
  - name: fasta_out
    label: "Output (FASTA)"
  - name: db_out
    show: false
    label: "Output (aligner database)"
  - name: store_3di
    label: "Store 3Di"
  - name: algorithm
    label: "Aligner"
  - name: reseek_stats
    show: false
    label: "reseek statistics level"
  - name: reseek_sensitivity
    show: false
    label: "reseek sensitivity"
  - name: foldseek_args
    show: false
    label: "foldseek options"
  - name: reseek_args
    show: false
    label: "reseek options"
  - name: foldseek_path
    show: false
    label: "foldseek path"
  - name: reseek_path
    show: false
    label: "reseek path"
  - name: tmp_dir
    show: false
    label: "Scratch directory"
  - name: cpu
    show: false
    label: "Cpu"
  - name: max_output_gb
    show: false
    label: "Max output gb"
