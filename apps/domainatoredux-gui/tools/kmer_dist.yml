# GUI dialog for `domainatoredux kmer_dist`. Format: see README.md in this directory.
id: kmer_dist
label: "K-mer distance"
description: "All-vs-all similarity from exact shared k-mers: fast, alignment-free, and needs no external binary."
fields:
  - name: input
    label: "Input sequences"
    file_type: [sequence]
    sources: workspace_first
    select: first
  - name: reference
    label: "Reference (optional)"
    file_type: [sequence]
    sources: workspace_first
    select: none
  - name: input_format
    show: false
    label: "Input format"
  - name: reference_format
    show: false
    label: "Reference format"
  - name: hdf_out
    label: "Output (matrix)"
    output_name: "{stem}.kmer.hdf5"
  - name: metric
    label: "Metric"
  - name: ksize
    label: "K-mer size"
  - name: mode
    label: "Mode"
  - name: threshold
    label: "Threshold"
  - name: mst
    label: "MST"
  - name: knn
    label: "kNN"
  - name: alphabet
    label: "FASTA alphabet"
  - name: nucleotide_kmers
    label: "Nucleotide k-mers"
  - name: gene_call
    label: "Call genes"
  - name: dense_text_out
    show: false
    label: "Output (dense text)"
  - name: max_hits_per_query
    show: false
    label: "Max hits per query"
  - name: cpu
    show: false
    label: "Cpu"
  - name: progress
    show: false
    label: "Progress"
  - name: max_output_gb
    show: false
    label: "Max output gb"
