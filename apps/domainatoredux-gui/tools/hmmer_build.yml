# GUI dialog for `domainatoredux hmmer_build`. Format: see README.md in this directory.
id: hmmer_build
label: "HMM build"
description: "Build an HMM profile from a multiple-sequence alignment."
fields:
  - name: input
    label: "Input MSA"
    file_type: [stockholm, alignment]
    sources: workspace_first
    select: first
  - name: hmm_out
    label: "Output (HMM)"
    output_name: "{stem}.hmm"
  - name: name
    label: "Profile name"
  - name: acc
    label: "Accession"
  - name: desc
    label: "Description"
  - name: alphabet
    label: "Alphabet"
  - name: window_length
    show: false
    label: "Window length"
  - name: window_beta
    show: false
    label: "Window beta"
