# GUI dialog for `domainatoredux rotate_contigs`. Format: see README.md in this directory.
id: rotate_contigs
label: "Rotate contigs"
description: "Set the origin of circular contigs relative to a domain, found by a reference search or already annotated."
fields:
  - name: input
    label: "Input sequences"
    file_type: sequence
    sources: workspace_first
    select: first
  - name: genbank_out
    label: "Output (GenBank)"
    output_name: "{stem}.rotated.gb"
  - name: fasta_out
    label: "Output (FASTA)"
  - name: reference
    label: "References (HMM/FASTA)"
    file_type: reference
    sources: databases_first
    select: none
  - name: domains
    label: "Rotate on domains"
  - name: domains_file
    label: "Domains file"
    file_type: [text, hmm]
    sources: workspace_first
    select: none
  - name: databases
    label: "Databases"
  - name: annotation_type
    label: "Annotations"
  - name: anchor
    label: "Anchor"
  - name: evalue
    label: "E-value"
  - name: Z
    label: "Z (db size)"
  - name: keep_direction
    label: "Keep direction"
  - name: circularize
    label: "Circularize"
  - name: keep_name
    label: "Keep name"
  - name: keep_annotation
    label: "Keep annotation"
  - name: gene_call
    label: "Gene calling"
    help: "Call genes with Orphos (Tools → External tools) before searching: needed to search protein references against contigs with no CDS annotations, such as FASTA records."
  - name: max_mode
    show: false
    label: "Max mode"
  - name: cpu
    show: false
    label: "Cpu"
  - name: batch_size
    show: false
    label: "Batch size"
