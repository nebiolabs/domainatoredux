# GUI dialog for `domainatoredux enum_report`. Format: see README.md in this directory.
id: enum_report
label: "Enum report (export)"
description: "Export a per-contig/cds/domain TSV report from a sequence file with a chosen column set."
fields:
  - name: input
    label: "Input sequences"
    file_type: sequence
    sources: workspace_first
    select: first
  - name: tsv_out
    label: "Output (TSV)"
    output_name: "{stem}.enum.tsv"
  - name: html_out
    label: "HTML table (optional)"
    help: "An interactive table page that opens in any browser, offline."
  - name: html_max_height
    show: false
    label: "HTML table height (px)"
  - name: by
    label: "By"
  - name: columns
    label: "Columns"
    help: "One row per output column, top to bottom. Each column's description is under its row."
    gui_default: [domains, architecture, length]
    # Columns and their arguments come from `domainatoredux describe --tool
    # enum_report`; this only relabels and seeds them (see README.md, "Column builder").
    column_types:
      taxid:
        params:
          rank:
            default: [species]
            choices: [self, domain, realm, kingdom, phylum, class, order, family, genus, species]
      taxname:
        params:
          rank:
            default: [species]
            choices: [self, domain, realm, kingdom, phylum, class, order, family, genus, species]
      qualifier:
        params:
          feature:
            default: "CDS"
            choices: [CDS, gene, source, misc_feature]
          qualifier:
            choices: [product, gene, locus_tag, protein_id, note]
      feature_count:
        params:
          feature:
            default: "CDS"
            choices: [CDS, gene, source, misc_feature]
      net_charge:
        params:
          pH:
            default: "7.0"
      repeat_count:
        params:
          length:
            default: "2"
      append:
        params:
          type:
            default: "str"
            choices: [str, int, float]
  - name: partial
    label: "Fragments"
    help: "Which rows to report, by fragment status. By contig, a nucleotide contig is a fragment if any of its CDSs is; by domain, the CDS or protein the domain is on decides."
  - name: databases
    show: false
    label: "Databases"
  - name: contigs
    show: false
    label: "Contigs"
  - name: contigs_file
    show: false
    label: "Contigs file"
  - name: column_names
    show: false
    label: "Column names"
  - name: ncbi_taxonomy_path
    label: "Taxonomy database"
    file_type: taxonomy
    sources: databases_first
    select: "database:ncbi_taxonomy"
  - name: taxonomy_update
    # The Databases panel checks and refreshes the managed taxdump and records
    # its version; a job refreshing it in place would bypass that.
    show: false
    label: "Update taxonomy"
  - name: json_out
    show: false
    label: "JSON output"
