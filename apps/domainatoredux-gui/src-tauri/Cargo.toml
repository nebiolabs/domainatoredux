[package]
name = "domainatoredux-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Geneious-inspired Tauri desktop GUI for the Domainator suite."

[lib]
name = "domainatoredux_gui"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "domainatoredux-gui"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }
# `build.rs` parses the tool spec files (`../tools/*.yml`) before embedding them.
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }

[lints]
workspace = true

[dependencies]
domainator-core = { path = "../../../crates/domainator-core" }
domainator-config = { path = "../../../crates/domainator-config" }
# Tools-menu jobs run the CLI in a worker copy of this executable (`worker.rs`).
domainator-cli = { path = "../../../crates/domainator-cli" }
anyhow.workspace = true
rfd = "0.17.2"
tauri = { version = "2.11.4", features = [] }
serde = { workspace = true }
serde_json = { workspace = true }
# The embedded tool spec files (`tool_specs.rs`).
serde_yaml = { workspace = true }
# External-tool auto-download (diamond, and future binaries):
ureq.workspace = true
flate2.workspace = true
tar = "0.4"
zip.workspace = true
# `reference_dbs`: UniProt/UniRef ship plain gzip, which is not seekable, so a
# downloaded sequence database is recompressed as BGZF on the way to disk.
bgzf.workspace = true
# `reference_dbs`: free-space preflight. `default-features = false` drops the file
# locking half of the crate (and its async runtimes) -- all that is wanted here is
# `available_space`, which is three platform statfs calls we would otherwise write
# by hand. It pulls in nothing new: libc and windows-sys are already in the tree.
fs4.workspace = true
tauri-plugin-window-state = "2.4.1"
tauri-plugin-opener = "2.5.5"
# `save_binary_file`: the JSON IPC bridge carries the PNG payload base64-encoded.
base64 = "0.22"

# `worker.rs`: kill a job's whole process tree. Both crates are already in the
# dependency tree (through Tauri), so neither adds anything to the build.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[features]
# GPU backends for `find_features --tmbed`, run by the worker through domainator-cli.
cuda = ["domainator-cli/cuda"]
metal = ["domainator-cli/metal"]
