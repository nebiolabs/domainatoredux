# GUI dialog for `domainatoredux extract_domains`. Format: see README.md in this directory.
id: extract_domains
label: "Extract domains"
description: "Extract annotated domain regions as their own records (GenBank or FASTA)."
fields:
  - name: input
    label: "Input sequences"
    role: input_files
    file_type: sequence
    required: true
    sources: workspace_first
    select: first
  - name: output
    label: "Output"
    role: output_file
    required: true
    output_name: "{stem}.domains.gb"
  - name: fasta_out
    label: "FASTA output"
  - name: domains
    label: "Domain names"
  - name: databases
    label: "Databases"
  - name: search_hits
    label: "Search hits"
  - name: evalue
    label: "Max E-value"
  - name: score
    label: "Min score"
  - name: pad_up
    label: "Pad upstream"
  - name: pad_down
    label: "Pad downstream"
  - name: combine
    label: "Combine adjacent"
  - name: splice
    label: "Splice"
  - name: keep_direction
    label: "Keep direction"
  - name: keep_name
    label: "Keep name"
  - name: contigs
    label: "Restrict to contigs"
  - name: partial
    label: "Fragments"
    help: "Which domains to extract, by the fragment status of the CDS or protein they are on."
  - name: domains_file
    show: false
    label: "Domains file"
  - name: contigs_file
    show: false
    label: "Contigs file"
