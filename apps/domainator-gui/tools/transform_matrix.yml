# GUI dialog for `domainatoredux transform_matrix`. Format: see README.md in this directory.
id: transform_matrix
label: "Transform matrix"
description: "Rescale, reconcile or prune a similarity matrix (mode, threshold, MST/kNN, symmetrize)."
fields:
  - name: input
    label: "Input matrix"
    file_type: hdf5
    sources: workspace_first
    select: first
  - name: hdf_out
    label: "Output (matrix)"
    output_name: "{stem}.transformed.hdf5"
  - name: mode
    label: "Mode"
  - name: threshold
    label: "Threshold"
  - name: mst
    label: "MST"
  - name: knn
    label: "kNN"
  - name: symmetrize
    label: "Symmetrize"
  - name: dense_text_out
    show: false
    label: "Output (dense text)"
  - name: value_type
    show: false
    label: "Input value type"
  - name: max_output_gb
    show: false
    label: "Max output gb"
