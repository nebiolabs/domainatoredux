# GUI dialog for `domainatoredux transform_matrix`. Format: see README.md in this directory.
id: transform_matrix
label: "Transform matrix"
description: "Rescale or prune a similarity matrix (mode, lower bound, MST-kNN)."
fields:
  - name: input
    label: "Input matrix"
    role: input_file
    file_type: hdf5
    required: true
    sources: workspace_first
    select: first
  - name: sparse
    label: "Output (matrix)"
    role: output_file
    required: true
    output_name: "{stem}.transformed.hdf5"
  - name: mode
    label: "Mode"
  - name: lb
    label: "Lower bound"
  - name: mst_knn
    label: "MST-kNN k"
  - name: dense
    show: false
    label: "Dense"
  - name: dense_text
    show: false
    label: "Dense text"
  - name: input_type
    show: false
    label: "Input type"
  - name: knn
    show: false
    label: "Knn"
  - name: max_output_gb
    show: false
    label: "Max output gb"
