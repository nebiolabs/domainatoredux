# GUI dialog for `domainatoredux hmmer_compare`. Format: see README.md in this directory.
id: hmmer_compare
label: "HMM compare"
description: "Profile-vs-profile Viterbi comparison; writes a scores table and optionally the alignments."
fields:
  - name: input
    label: "Query HMM(s)"
    file_type: hmm
    sources: workspace_first
    select: first
  - name: reference
    label: "Reference HMM(s)"
    file_type: hmm
    sources: databases_first
    select: "database:pfam"
  - name: tsv_out
    label: "Output (table)"
    required: true
    output_name: "{stem}.compare.tsv"
  - name: alignments_out
    label: "Alignments"
    output_name: "{stem}.alignments.txt"
  - name: min_score
    label: "Minimum score"
  - name: max_hits_per_query
    label: "Top hits per query"
  - name: cpu
    show: false
    label: "Cpu"
  - name: max_output_gb
    show: false
    label: "Max output gb"
