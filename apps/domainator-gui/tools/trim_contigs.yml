# GUI dialog for `domainatoredux trim_contigs`. Format: see README.md in this directory.
id: trim_contigs
label: "Trim contigs"
description: "Trim the ends of contigs by kb, CDS count, or up to a domain boundary."
fields:
  - name: input
    label: "Input sequences"
    file_type: sequence
    sources: workspace_first
    select: first
  - name: genbank_out
    label: "Output (GenBank)"
    output_name: "{stem}.trimmed.gb"
  - name: fasta_out
    label: "Output (FASTA)"
  - name: kb_range
    label: "kb both ends"
  - name: kb_left
    label: "kb left"
  - name: kb_right
    label: "kb right"
  - name: cds_range
    label: "CDS both ends"
  - name: cds_left
    label: "CDS left"
  - name: cds_right
    label: "CDS right"
  - name: domains
    label: "Trim to domains"
  - name: domain_expr
    label: "Domain expr"
  - name: evalue
    label: "E-value"
  - name: databases
    label: "Databases"
  - name: unannotated
    label: "Drop domain-less"
  - name: contigs
    label: "Restrict to contigs"
  - name: domains_file
    show: false
    label: "Domains file"
  - name: contigs_file
    show: false
    label: "Contigs file"
