# GUI dialog for `domainatoredux deduplicate`. Format: see README.md in this directory.
id: deduplicate_genbank
label: "Deduplicate"
description: "Collapse near-identical sequences to representatives (hash, or diamond/cd-hit/usearch backends)."
fields:
  - name: input
    label: "Input sequences"
    role: input_files
    file_type: sequence
    required: true
    sources: workspace_first
    select: first
  - name: output
    label: "Output"
    role: output_file
    required: true
    output_name: "{stem}.dedup.gb"
  - name: algorithm
    label: "Algorithm"
  - name: id
    label: "Identity threshold"
    required: true
  - name: fasta_out
    label: "FASTA output"
  - name: fasta_type
    label: "FASTA type"
  - name: both_strands
    label: "Both strands"
  - name: prefix_count
    label: "Prefix count"
  - name: suffix_count
    label: "Suffix count"
  - name: cluster_table
    label: "Cluster table (out)"
    role: output_file
  - name: cluster_sep
    label: "Cluster separator"
  - name: bin_path
    show: false
    label: "Binary path"
  - name: log
    show: false
    label: "Log"
  - name: cpu
    show: false
    label: "Cpu"
  - name: params
    show: false
    label: "Params"
