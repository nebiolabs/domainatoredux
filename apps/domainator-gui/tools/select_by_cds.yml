# GUI dialog for `domainatoredux select_by_cds`. Format: see README.md in this directory.
id: select_by_cds
label: "Select by CDS"
description: "Extract CDSs (and optionally their genomic neighborhoods) by name, domain content, or search hit."
fields:
  - name: input
    label: "Input sequences"
    role: input_files
    file_type: sequence
    required: true
    sources: workspace_first
    select: first
  - name: output
    label: "Output (GenBank)"
    role: output_file
    required: true
    output_name: "{stem}.selected_cds.gb"
  - name: cds
    label: "CDS names"
  - name: cds_file
    label: "CDS names file (.txt)"
    role: input_file
    file_type: text
    sources: workspace_first
    select: none
  - name: domains
    label: "Domain names"
  - name: domains_file
    label: "Domain names file (.txt)"
    role: input_file
    file_type: text
    sources: workspace_first
    select: none
  - name: domain_expr
    label: "Domain expr"
  - name: databases
    label: "Databases"
  - name: search_hits
    label: "Search hits"
  - name: unannotated
    label: "Unannotated"
  - name: invert
    label: "Invert"
  - name: evalue
    label: "E-value"
  - name: contigs
    label: "Restrict to contigs"
  - name: contigs_file
    label: "Contigs file (.txt)"
    role: input_file
    file_type: text
    sources: workspace_first
    select: none
  - name: whole_contig
    label: "Whole contig"
  - name: cds_range
    label: "CDS range (±)"
  - name: cds_up
    label: "CDS upstream"
  - name: cds_down
    label: "CDS downstream"
  - name: kb_range
    label: "kb range (±)"
  - name: kb_up
    label: "kb upstream"
  - name: kb_down
    label: "kb downstream"
  - name: strand
    label: "Strand (f/r)"
  - name: keep_direction
    label: "Keep direction"
  - name: pad
    label: "Pad to equal length"
  - name: skip_deduplicate
    label: "Skip dedup"
  - name: max_region_overlap
    label: "Max region overlap"
  - name: include_nucleic_acids
    label: "Include nucleic acids"
  - name: partial
    label: "Fragments"
    help: "Which CDSs to extract regions around, by fragment status. Not affected by Invert."
