# GUI dialog for `domainator genbank-to-fasta`. Format: see README.md in this directory.
id: genbank-to-fasta
label: "GenBank → FASTA"
category: "Conversion"
description: "Convert sequence records to FASTA."
fields:
  - name: input
    label: "Input sequences"
    role: input_files
    file_type: sequence
    required: true
    sources: workspace_first
    select: first
  - name: output
    label: "Output (FASTA)"
    role: output_file
    required: true
    output_name: "{stem}.fasta"
