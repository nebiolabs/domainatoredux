# GUI dialog for `domainatoredux hmmer_report`. Format: see README.md in this directory.
id: hmmer_report
label: "HMM report (export)"
description: "Export a per-profile TSV/JSON report from HMM file(s) with a custom column set."
fields:
  - name: input
    label: "Input HMM(s)"
    file_type: hmm
    sources: workspace_first
    select: first
  - name: tsv_out
    label: "Output (TSV)"
    output_name: "{stem}.hmm_report.tsv"
  - name: columns
    label: "Columns"
    help: "A leading name column is always included; the columns below follow it."
    gui_default: [source, length]
  - name: json_out
    label: "JSON output (optional)"
  - name: column_names
    show: false
    label: "Column names"
