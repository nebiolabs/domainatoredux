# GUI dialog for `domainatoredux extract_unannotated`. Format: see README.md in this directory.
id: extract_unannotated
label: "Extract unannotated"
description: "Extract the regions of each CDS/contig with no domain annotation."
fields:
  - name: input
    label: "Input sequences"
    role: input_files
    file_type: sequence
    required: true
    sources: workspace_first
    select: first
  - name: output
    label: "Output"
    role: output_file
    required: true
    output_name: "{stem}.unannotated.gb"
  - name: fasta_out
    label: "FASTA output"
  - name: databases
    label: "Databases"
  - name: search_hits
    label: "Search hits"
  - name: largest
    label: "Largest only"
  - name: lb
    label: "Min length"
  - name: keep_direction
    label: "Keep direction"
  - name: keep_name
    label: "Keep name"
  - name: evalue
    label: "Max E-value"
  - name: score
    label: "Min score"
  - name: contigs
    label: "Restrict to contigs"
  - name: contigs_file
    show: false
    label: "Contigs file"
