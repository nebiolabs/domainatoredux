# GUI dialog for `domainatoredux seq_dist`. Format: see README.md in this directory.
id: seq_dist
label: "Sequence distance"
description: "All-vs-all sequence similarity matrix (step 3; default 'hmmer' is pure-Rust — diamond algorithms need the diamond binary)."
fields:
  - name: input
    label: "Input sequences"
    file_type: [sequence, hmm]
    sources: workspace_first
    select: first
  - name: reference
    label: "Reference (optional)"
    file_type: [sequence, hmm]
    sources: workspace_first
    select: none
  - name: input_format
    show: false
    label: "Input format"
  - name: reference_format
    show: false
    label: "Reference format"
  - name: hdf_out
    label: "Output (matrix)"
    output_name: "{stem}.dist.hdf5"
  - name: algorithm
    label: "Algorithm"
    gui_default: "diamond_us"
  - name: mode
    label: "Mode"
  - name: threshold
    label: "Threshold"
  - name: mst
    label: "MST"
  - name: knn
    label: "kNN"
  - name: symmetrize
    label: "Symmetrize"
  - name: dense_text_out
    show: false
    label: "Output (dense text)"
  - name: max_hits_per_query
    show: false
    label: "Max hits per query"
  - name: diamond_args
    show: false
    label: "Diamond args"
  - name: diamond_path
    show: false
    label: "Diamond path"
  - name: cpu
    show: false
    label: "Cpu"
  - name: progress
    show: false
    label: "Progress"
  - name: max_output_gb
    show: false
    label: "Max output gb"
