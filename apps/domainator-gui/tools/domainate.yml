# GUI dialog for `domainatoredux domainate`. Format: see README.md in this directory.
id: domainate
label: "Domainate"
description: "Annotate sequences with domains from HMM/FASTA references (step 2)."
fields:
  - name: input
    label: "Input sequences"
    file_type: sequence
    sources: workspace_first
    select: first
  - name: reference
    label: "References (HMM/FASTA)"
    file_type: reference
    sources: databases_first
    select: "database:pfam"
    prefill_priority: 1
  - name: genbank_out
    label: "Output (GenBank)"
    output_name: "{stem}.annotated.gb"
  - name: fasta_out
    label: "Output (FASTA)"
  - name: evalue
    label: "E-value"
  - name: Z
    label: "Z (db size)"
  - name: max_hits_per_cds
    label: "Max hits per CDS"
  - name: max_overlap
    label: "Max overlap"
    gui_default: 0.6
  - name: max_mode
    label: "Max mode"
  - name: hits_only
    label: "Hits only"
  - name: include_taxids
    label: "Include taxids"
  - name: exclude_taxids
    label: "Exclude taxids"
  - name: taxonomy_expr
    label: "Taxonomy expr"
  - name: ncbi_taxonomy_path
    label: "Taxonomy database"
    file_type: taxonomy
    sources: databases_first
    select: "database:ncbi_taxonomy"
  - name: gene_call
    label: "Gene calling"
    help: "Call genes with Orphos (Tools → External tools) before searching: all re-calls every nucleotide contig, unannotated only those with no CDS. Set Z too."
  - name: partial
    label: "Fragments"
    help: "Which CDSs/proteins to search, by fragment status: include (all), exclude (skip fragments), only (only fragments). Records are written either way."
  - name: min_evalue
    show: false
    label: "Min evalue"
  - name: overlap_by_db
    show: false
    label: "Overlap by db"
  - name: no_annotations
    show: false
    label: "No annotations"
  - name: cpu
    show: false
    label: "Cpu"
  - name: alphabet
    show: false
    label: "Alphabet"
  - name: batch_size
    show: false
    label: "Batch size"
  - name: max_output_gb
    show: false
    label: "Max output (GB)"
