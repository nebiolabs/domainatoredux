# GUI dialog for `domainatoredux build_ssn`. Format: see README.md in this directory.
id: build_ssn
label: "Build SSN (XGMML)"
category: "Matrices & networks"
description: "Build a Cytoscape XGMML network from a similarity matrix."
fields:
  - name: input
    label: "Input matrix"
    role: input_file
    file_type: hdf5
    required: true
    sources: workspace_first
    select: first
  - name: xgmml
    label: "Output (XGMML)"
    role: output_file
    required: true
    output_name: "{stem}.xgmml"
  - name: metadata
    label: "Metadata (TSV)"
    role: input_files
    file_type: table
    sources: workspace_first
    select: none
  - name: cluster
    label: "Cluster"
    cli_default: false
  - name: cluster_tsv
    label: "Cluster TSV"
    role: output_file
    output_name: "{stem}.clusters.tsv"
  - name: lb
    label: "Lower bound"
    cli_default: 0.0
  - name: mst
    label: "MST only"
    cli_default: false
  - name: mst_knn
    label: "MST-kNN k"
  - name: color_by
    label: "Color by"
  - name: color_table
    label: "Color table (in)"
    role: input_file
    file_type: table
    sources: workspace_first
    select: none
  - name: color_table_out
    label: "Color table (out)"
    role: output_file
  - name: subset
    show: false
    label: "Subset"
  - name: subset_file
    show: false
    label: "Subset file"
  - name: max_color_groups
    show: false
    label: "Max color groups"
  - name: no_cluster_header
    show: false
    label: "No cluster header"
    cli_default: false
  - name: knn
    show: false
    label: "Knn"
  - name: max_output_gb
    show: false
    label: "Max output gb"
    cli_default: 25.0
