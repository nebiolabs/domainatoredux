# GUI dialog for `domainatoredux filter_domains`. Format: see README.md in this directory.
id: filter_domains
label: "Filter domains"
description: "Remove domain annotations from records by e-value, overlap, name, or database (keeps the sequences)."
fields:
  - name: input
    label: "Input sequences"
    role: input_files
    file_type: sequence
    required: true
    sources: workspace_first
    select: first
  - name: output
    label: "Output (GenBank)"
    role: output_file
    required: true
    output_name: "{stem}.filtered.gb"
  - name: evalue
    label: "Max E-value"
  - name: max_overlap
    label: "Max overlap"
  - name: domains
    label: "Keep domains"
  - name: domains_file
    label: "Keep domains file (.txt)"
    role: input_file
    file_type: text
    sources: workspace_first
    select: none
  - name: databases_keep
    label: "Keep databases"
  - name: databases_filter
    label: "Remove databases"
  - name: annotation_type
    label: "Annotation type"
  - name: contigs
    label: "Restrict to contigs"
  - name: contigs_file
    label: "Contigs file (.txt)"
    role: input_file
    file_type: text
    sources: workspace_first
    select: none
