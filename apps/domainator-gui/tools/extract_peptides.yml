# GUI dialog for `domainatoredux extract_peptides`. Format: see README.md in this directory.
id: extract_peptides
label: "Extract peptides"
description: "Extract CDS translations (peptides) by domain/CDS name, search hit, or all."
fields:
  - name: input
    label: "Input sequences"
    role: input_files
    file_type: sequence
    required: true
    sources: workspace_first
    select: first
  - name: output
    label: "Output"
    role: output_file
    required: true
    output_name: "{stem}.peptides.gb"
  - name: fasta_out
    label: "FASTA output"
  - name: domains
    label: "Domain names"
  - name: cdss
    label: "CDS names"
  - name: databases
    label: "Databases"
  - name: unannotated
    label: "Unannotated"
  - name: search_hits
    label: "Search hits"
  - name: strand
    label: "Strand (f/r)"
  - name: invert
    label: "Invert"
  - name: keep_name
    label: "Keep name"
  - name: name_field
    label: "Name field"
  - name: evalue
    label: "Max E-value"
  - name: contigs
    label: "Restrict to contigs"
  - name: partial
    label: "Fragments"
    help: "Which CDSs to extract peptides from, by fragment status. Not affected by Invert."
  - name: domains_file
    show: false
    label: "Domains file"
  - name: cdss_file
    show: false
    label: "Cdss file"
  - name: contigs_file
    show: false
    label: "Contigs file"
