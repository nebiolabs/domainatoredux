# GUI dialog for `domainatoredux compare_contigs`. Format: see README.md in this directory.
id: compare_contigs
label: "Compare contigs"
description: "Neighborhood-similarity matrix from domain content (step 3 alternative; pure-Rust)."
fields:
  - name: input
    label: "Input GenBank"
    file_type: genbank
    sources: workspace_first
    select: first
  - name: contigs
    show: false
    label: "Contigs"
  - name: contigs_file
    show: false
    label: "Contigs file (.txt)"
    file_type: text
    sources: workspace_first
    select: none
  - name: hdf_out
    label: "Output (matrix)"
    output_name: "{stem}.compare.hdf5"
  - name: ji
    label: "Jaccard weight"
  - name: ai
    label: "Adjacency weight"
  - name: max_hits_per_query
    label: "Max hits per query"
  - name: threshold
    label: "Threshold"
  - name: mst
    label: "MST"
  - name: knn
    label: "kNN"
  - name: dense_text_out
    show: false
    label: "Output (dense text)"
  - name: databases
    show: false
    label: "Databases"
  - name: cpu
    show: false
    label: "Cpu"
  - name: progress
    show: false
    label: "Progress"
  - name: max_output_gb
    show: false
    label: "Max output gb"
