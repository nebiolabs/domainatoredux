# GUI dialog for `domainatoredux gene_call`. Format: see README.md in this directory.
id: gene_call
label: "Gene call"
description: "Add Prodigal-style CDS features to nucleotide contigs with Orphos (an external binary: Tools → External tools)."
fields:
  - name: input
    label: "Input sequences"
    file_type: sequence
    sources: workspace_first
    select: first
  - name: genbank_out
    label: "Output"
    output_name: "{stem}.genes.gb"
  - name: mode
    label: "Mode"
    help: "meta: pre-trained models chosen per contig (metagenomes, plasmids, phages, short contigs). single: train on all input records together (one complete genome)."
  - name: scope
    label: "Contigs"
    help: "unannotated: call only contigs with no CDS. all: delete every CDS (and its Domainator annotations) and re-call every contig."
  - name: translation_table
    label: "Translation table"
  - name: closed
    label: "Closed ends"
  - name: mask
    label: "Mask N runs"
  - name: alphabet
    label: "Alphabet"
  - name: cpu
    show: false
    label: "Cpu"
  - name: orphos_path
    show: false
    label: "Orphos path"
