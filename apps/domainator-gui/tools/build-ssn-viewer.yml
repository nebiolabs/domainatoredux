# GUI dialog for `domainator build-ssn-viewer`. Format: see README.md in this directory.
id: build-ssn-viewer
label: "Build SSN viewer"
category: "Matrices & networks"
description: "Build a .dsnv bundle for the interactive network viewer."
fields:
  - name: input
    label: "Input matrix"
    role: input_file
    file_type: hdf5
    required: true
    sources: workspace_first
    select: active_file
  - name: output
    label: "Output (.dsnv)"
    role: output_file
    required: true
    output_name: "{stem}.dsnv"
  - name: metadata
    label: "Metadata (TSV)"
    role: input_files
    file_type: table
    sources: workspace_first
    select: none
  - name: merge_impact_metric
    label: "Merge metric"
    cli_default: "min_child"
  - name: html
    show: false
    label: "Html"
  - name: embed_data
    show: false
    label: "Embed data"
    cli_default: false
  - name: name
    show: false
    label: "Name"
  - name: subset
    show: false
    label: "Subset"
  - name: subset_file
    show: false
    label: "Subset file"
  - name: color_by
    show: false
    label: "Color by"
  - name: label_by
    show: false
    label: "Label by"
  - name: categorical
    show: false
    label: "Categorical"
  - name: max_output_gb
    show: false
    label: "Max output gb"
    cli_default: 25.0
