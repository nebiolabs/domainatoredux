# GUI dialog for `domainatoredux hmmer_search`. Format: see README.md in this directory.
id: hmmer_search
label: "HMM search"
description: "Keep query profiles that score against a reference HMM set (writes an HMM file)."
fields:
  - name: input
    label: "Query HMM(s)"
    role: input_files
    file_type: hmm
    required: true
    sources: workspace_first
    select: first
  - name: reference
    label: "Reference HMM(s)"
    role: input_files
    file_type: hmm
    required: true
    sources: databases_first
    select: "database:pfam"
  - name: output
    label: "Output (HMM)"
    role: output_file
    required: true
    output_name: "{stem}.searched.hmm"
  - name: score_cutoff
    label: "Score cutoff"
  - name: max_hits
    label: "Max hits"
  - name: cpu
    show: false
    label: "Cpu"
  - name: max_output_gb
    show: false
    label: "Max output gb"
