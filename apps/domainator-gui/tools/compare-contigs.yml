# GUI dialog for `domainator compare-contigs`. Format: see README.md in this directory.
id: compare-contigs
label: "Compare contigs"
category: "Matrices & networks"
description: "Neighborhood-similarity matrix from domain content (step 3 alternative; pure-Rust)."
fields:
  - name: input
    label: "Input GenBank"
    role: input_files
    file_type: genbank
    required: true
    sources: workspace_first
    select: active_file
  - name: sparse
    label: "Output (matrix)"
    role: output_file
    required: true
    output_name: "{stem}.compare.hdf5"
  - name: ji
    label: "Jaccard weight"
    cli_default: 0.5
  - name: ai
    label: "Adjacency weight"
    cli_default: 0.5
  - name: k
    label: "kNN k"
  - name: lb
    label: "Lower bound"
    cli_default: 0.0
  - name: mst_knn
    label: "MST-kNN k"
  - name: dense
    show: false
    label: "Dense"
  - name: dense_text
    show: false
    label: "Dense text"
  - name: databases
    show: false
    label: "Databases"
  - name: knn
    show: false
    label: "Knn"
  - name: cpu
    show: false
    label: "Cpu"
    cli_default: 0
  - name: max_output_gb
    show: false
    label: "Max output gb"
    cli_default: 25.0
