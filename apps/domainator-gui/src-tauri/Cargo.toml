[package]
name = "domainator-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Geneious-inspired Tauri desktop GUI for the Domainator suite."

[lib]
name = "domainator_gui"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "domainator-gui"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
domainator-core = { path = "../../../crates/domainator-core" }
domainator-config = { path = "../../../crates/domainator-config" }
rfd = "0.17.2"
tauri = { version = "2.11.4", features = [] }
serde = { workspace = true }
serde_json = { workspace = true }
# External-tool auto-download (diamond, and future binaries):
ureq = "2"
flate2 = "1"
tar = "0.4"
