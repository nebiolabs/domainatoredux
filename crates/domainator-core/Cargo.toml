[package]
name = "domainator-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Core data model, sequence I/O, and tool logic for the Domainator Rust rewrite."

[lints]
workspace = true

[dependencies]
hmmer-pure-rs.workspace = true
infernox.workspace = true
hdf5-pure.workspace = true
rayon.workspace = true
num_cpus.workspace = true
sysinfo.workspace = true
bgzf.workspace = true
libdeflater.workspace = true
flate2.workspace = true
zip.workspace = true
memchr.workspace = true
thiserror.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
faer.workspace = true
shlex.workspace = true
fs4.workspace = true
indicatif.workspace = true
glob.workspace = true
# `network`: fetching NCBI's taxdump (`seq::taxonomy_download`).
ureq = { workspace = true, optional = true }
md-5 = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
# `plm`: protein language models (`find_features --tmbed`).
domainator-plm = { path = "../domainator-plm", optional = true }

[features]
# Downloads over HTTPS (the NCBI taxdump). Off by default so the library carries no
# HTTP/TLS client unless a front end asks for one; the CLI turns it on.
network = ["dep:ureq", "dep:md-5", "dep:sha2"]
# Protein language models on candle (TMbed), CPU by default; `cuda`/`metal` add GPUs.
plm = ["dep:domainator-plm"]
cuda = ["plm", "domainator-plm/cuda"]
metal = ["plm", "domainator-plm/metal"]
