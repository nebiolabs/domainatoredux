[package]
name = "domainator-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Single-executable CLI for the Domainator Rust rewrite (`domainator <tool> [opts]`)."

[[bin]]
name = "domainator"
path = "src/main.rs"

[dependencies]
domainator-core = { path = "../domainator-core" }
domainator-config = { path = "../domainator-config" }
clap.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
