# cargo-deny (EmbarkStudios/cargo-deny), run in CI's `policy` job; locally
# `cargo install cargo-deny && cargo deny check`.
#
# The license list is the point. This project stays MIT by driving GPL tools
# (cd-hit, usearch) only as downloaded subprocesses and never linking them (see
# CLAUDE.md, "External binaries"). A copyleft crate arriving as an ordinary
# dependency would undo that without anyone noticing; this file makes it a CI
# failure instead.

[graph]
all-features = true

[advisories]
# RustSec: vulnerabilities fail; unmaintained crates are reported only for our
# direct dependencies, since a transitive one (much of Tauri's GTK stack) is not
# ours to replace.
unmaintained = "workspace"
yanked = "deny"
ignore = []

[licenses]
confidence-threshold = 0.9
# Permissive licenses, plus MPL-2.0: file-level copyleft that reaches us only
# through Tauri's HTML tooling (cssparser, selectors, dtoa-short) and option-ext,
# and does not extend to code that merely links it. Anything GPL-family must
# not be added here; LGPL appears only as one option in r-efi's
# `MIT OR Apache-2.0 OR LGPL-2.1-or-later`, which MIT already satisfies.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[bans]
# Duplicate versions are routine under Tauri (two webpki-roots, two r-efi, ...)
# and are not worth failing on.
multiple-versions = "allow"
# Wildcard checking is off: the only `*`-free-version dependencies are the
# workspace path crates, which cargo-deny flags unless every crate is marked
# `publish = false`.
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# The one git dependency: hmmer-pure-rs pinned by `rev` (see Cargo.toml) --
# temporarily on our fork while the aarch64 PR is open. Swap this back to
# https://github.com/henriksson-lab/hmmer-pure-rs with the re-pin to the merge
# commit. Any other git source must be added here on purpose.
allow-git = ["https://github.com/seanrjohnson-neb/hmmer-pure-rs"]
