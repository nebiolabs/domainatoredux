[workspace]
resolver = "2"
members = ["crates/*", "apps/genbank-summary/src-tauri", "apps/domainator-gui/src-tauri"]
exclude = ["wasm_apps/genbank-summary/wasm"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.89"

[workspace.dependencies]
hmmer-pure-rs = "0.7"
hdf5-pure = "0.20"
rayon = "1"
bgzf = "0.3"
libdeflater = "1.25"
memchr = "2"
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# Vendored hdf5-pure carrying a local patch: a scalar variable-length UTF-8
# string attribute (`AttrValue::VarLenUtf8`) so the matrix HDF5 attrs
# (ARRAY_TYPE/DATA_TYPE/MATRIX_FILE_VERSION) read back as Python `str`, which
# the published 0.20.0 only exposes as fixed-length strings (h5py -> bytes).
[patch.crates-io]
hdf5-pure = { path = "vendor/hdf5-pure" }

# TEMPORARY: hmmer-pure-rs from a fork branch, pinned by commit.
#
# Published 0.7.1 cannot build a nucleotide model from a single sequence -- its
# `build_single_seq_hmm` hardcodes BLOSUM62 and panics on a 4-letter alphabet --
# so `search/references.rs` built each nhmmer FASTA query from a one-row MSA
# instead. That detour is not what pyhmmer does (C's `p7_SingleBuilder`: a DNA1
# score-matrix conversion plus the nucleotide window length nhmmer's E-values
# are computed against), and it is why eight nucleotide parity invocations
# diverged. This branch ports the real builder; with it our nucleotide hits
# match pyhmmer's coordinates, scores and E-values exactly.
#
# Pinned to a `rev`, not the branch, so a force-push cannot silently change what
# CI builds. See `UPSTREAM.md` for the migration back to the crates.io release.
hmmer-pure-rs = { git = "https://github.com/seanrjohnson-neb/hmmer-pure-rs", rev = "1ec332e512abff0a1e37d61385da501e974ed05e" }
