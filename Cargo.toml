[workspace]
resolver = "2"
members = ["crates/*", "apps/genbank-summary/src-tauri", "apps/domainatoredux-gui/src-tauri"]
exclude = ["wasm_apps/genbank-summary/wasm"]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MIT"
rust-version = "1.94"

[workspace.dependencies]
hmmer-pure-rs = "0.8"
# Exact pin: infernox is a byte-parity port of Infernal 1.1.5, and a release that changed
# its hits would change `.cm` annotations, so a bump is a deliberate re-verification.
infernox = "=0.2.0"
hdf5-pure = "0.20"
rayon = "1"
num_cpus = "1"
sysinfo = { version = "0.38", default-features = false, features = ["system"] }
bgzf = "0.3"
libdeflater = "1.25"
flate2 = "1"
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
memchr = "2"
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
shlex = "2"
# Free disk space, for the scratch notes in seq_dist's diamond messages and the GUI's
# download checks.
fs4 = { version = "1.1", default-features = false }
# HTTP(S) downloads: the GUI's managed tools and databases, and the taxdump fetch
# (`domainator-core`'s `network` feature).
ureq = "2"
md-5 = "0.10"
sha2 = "0.10"
# `--progress` bars (`domainator_core::progress`).
indicatif = { version = "0.17", default-features = false }
# Expanding `--input` globs for the structure tools (values from a `--config` file never
# reach a shell).
glob = "0.3"
faer = { version = "0.24", default-features = false, features = ["std"] }

# Lint policy lives here, not in CI flags, so a local `cargo clippy` enforces the same
# rules CI does. Every member opts in with `[lints] workspace = true`.
#
# `cast_sign_loss` is on because a negative coordinate cast to `usize` becomes an index
# near usize::MAX (it once crashed `trim_contigs`). Use `seq::location::to_index` for a
# coordinate already known non-negative, `stats::floor_index` for a float, and
# `usize::try_from` otherwise. `cast_possible_wrap` and `cast_possible_truncation` stay
# off: every target is 64-bit, where those casts (mostly usize <-> i64, u64 -> usize)
# cannot lose data, and the float ones mirror Python's `int()` on purpose.
[workspace.lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_op_in_unsafe_fn = "deny"
unused_qualifications = "warn"

[workspace.lints.clippy]
cast_sign_loss = "warn"
undocumented_unsafe_blocks = "warn"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# Vendored hdf5-pure carrying a local patch: a scalar variable-length UTF-8
# string attribute (`AttrValue::VarLenUtf8`) so the matrix HDF5 attrs
# (ARRAY_TYPE/DATA_TYPE/MATRIX_FILE_VERSION) read back as Python `str`, which
# the published 0.20.0 only exposes as fixed-length strings (h5py -> bytes).
[patch.crates-io]
hdf5-pure = { path = "vendor/hdf5-pure" }

# TEMPORARY: hmmer-pure-rs pinned to a commit on our fork, pending an upstream
# merge and a crates.io release.
#
# The official repo's code does no SIMD on aarch64: the MSV/Viterbi/Forward
# filters and domain definition fall back to generic DP, and nhmmer's long-target
# filter does not exist there, so on Apple Silicon hmmsearch was ~25x slower,
# about one domain in eight landed a few residues away from the x86/pyhmmer
# envelope, and nucleotide searches found nothing. The fork commit runs the same
# SSE kernels on aarch64 through a NEON implementation of the SSE2 intrinsics
# (`hmmer_pure_rs::simd::sse`); ARM output is byte-identical to x86 under QEMU.
# Branch seanrjohnson-neb/hmmer-pure-rs:aarch64-neon-pipeline, based on the
# official `main` (0.8.0, which also carries henriksson-lab/hmmer-pure-rs#2, the
# single-sequence nucleotide builder this pin previously existed for).
#
# Pinned to a commit, not a branch, so nothing moves under CI. Re-pin to the
# upstream merge commit once the PR lands, then to a plain version requirement
# once a release includes it -- see UPSTREAM.md, "Pinned dependency".
hmmer-pure-rs = { git = "https://github.com/seanrjohnson-neb/hmmer-pure-rs", rev = "99daaca00025e1ee17331b6b359596a90f1e409d" }
