[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.89"

[workspace.dependencies]
hmmer-pure-rs = "0.7"
hdf5-pure = "0.20"
rayon = "1"
bgzf = "0.3"
libdeflater = "1.25"
memchr = "2"
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# Vendored hdf5-pure carrying a local patch: a scalar variable-length UTF-8
# string attribute (`AttrValue::VarLenUtf8`) so the matrix HDF5 attrs
# (ARRAY_TYPE/DATA_TYPE/MATRIX_FILE_VERSION) read back as Python `str`, which
# the published 0.20.0 only exposes as fixed-length strings (h5py -> bytes).
[patch.crates-io]
hdf5-pure = { path = "vendor/hdf5-pure" }
