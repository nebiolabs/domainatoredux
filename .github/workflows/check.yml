name: Check

# The packaging workflows (build-release.yml, build-genbank-summary.yml) only build
# artifacts; this one verifies the code. `rust` is the fast gate for the
# pure-Rust crates (zero warnings from rustc, clippy and rustdoc, plus rustfmt); `gui`
# does the same for the two Tauri apps, whose system dependencies make it the slow one;
# `frontend` type-checks the three web frontends; `policy` holds the whole-repo checks
# (dependency licenses and advisories, American spelling, the mdbook); `msrv` keeps
# `rust-version` honest. Lint levels live in Cargo.toml's `[workspace.lints]`, so a
# local `cargo clippy` enforces the same rules.
#
# Manual dispatch only (Actions tab -> Check -> Run workflow, or `gh workflow run
# check.yml`): the checks are run locally before pushing, and this repo's Actions
# minutes come out of the nebiolabs organization's shared budget.
on:
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      # Whole workspace: rustfmt needs no system libraries, so the Tauri crates are
      # covered here too. `vendor/hdf5-pure` is not a member and is left alone.
      - name: Format
        run: cargo fmt --all --check

      # The Tauri app crates need webkit2gtk and friends; they build in the `gui` job.
      # These three are pure Rust.
      - name: Build (warnings are errors)
        env:
          RUSTFLAGS: "-D warnings"
        run: cargo build -p domainator-core -p domainator-config -p domainator-cli --examples

      - name: Test
        run: cargo test -p domainator-core -p domainator-config -p domainator-cli

      # `--all-targets` so tests and examples are linted too -- `cargo build` does not
      # compile `#[cfg(test)]` code, which is exactly how a broken test initializer
      # slipped through once before.
      - name: Clippy (warnings are errors)
        run: cargo clippy -p domainator-core -p domainator-config -p domainator-cli --all-targets -- -D warnings

      # A doc comment naming a function that was since renamed still compiles; only
      # rustdoc notices the link no longer resolves.
      - name: Rustdoc (warnings are errors)
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --no-deps -p domainator-core -p domainator-config -p domainator-cli

  # The two Tauri apps. This is where the GUI's own guards run -- the tool registry vs
  # CLI vs manifest checks, the tool-spec tests, the reference-database storage tests --
  # none of which have an upstream to be checked against.
  gui:
    name: gui build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          key: gui

      # Same list as build-release.yml, minus the AppImage-only patchelf.
      - name: Install WebKitGTK
        run: |
          sudo apt update
          sudo apt install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev librsvg2-dev

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      # `tauri::generate_context!` embeds `frontendDist` at compile time, and `dist/`
      # is gitignored, so both frontends must be built before cargo sees the crates.
      - name: Build the frontends
        run: |
          for app in apps/domainatoredux-gui apps/genbank-summary; do
            (cd "$app" && npm ci && npm run build)
          done

      - name: Clippy, whole workspace (warnings are errors)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rustdoc, whole workspace (warnings are errors)
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --no-deps --workspace

      - name: Test the apps
        run: cargo test -p domainatoredux-gui -p domainator-genbank-summary

  # Type checks and the frontend's unit tests; no Rust toolchain needed. genbank-summary has no svelte-check,
  # but its `build` script runs `tsc`, which is the same gate.
  frontend:
    name: frontend type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: svelte-check (domainatoredux-gui)
        working-directory: apps/domainatoredux-gui
        run: |
          npm ci
          npx svelte-check --tsconfig ./tsconfig.json --fail-on-warnings

      - name: vitest (domainatoredux-gui)
        working-directory: apps/domainatoredux-gui
        run: npm test

      - name: tsc (genbank-summary, desktop and wasm)
        run: |
          for app in apps/genbank-summary wasm_apps/genbank-summary; do
            (cd "$app" && npm ci && npx tsc --noEmit)
          done

      # Shipped dependencies only: dev-only advisories (the vite/esbuild dev server)
      # never reach a user and often need a major bump to clear.
      - name: npm audit (runtime dependencies)
        run: |
          for app in apps/domainatoredux-gui apps/genbank-summary wasm_apps/genbank-summary; do
            (cd "$app" && npm audit --omit=dev --audit-level=high)
          done

  # Repository-wide checks that need no build.
  policy:
    name: licenses, advisories, spelling, book
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # deny.toml: the license allowlist (no GPL-family crate may slip in as a
      # dependency), RustSec advisories, and the allowed git sources.
      - uses: EmbarkStudios/cargo-deny-action@v2

      # _typos.toml: typos plus the American-English rule. Pinned to an exact
      # release, as upstream advises: each release adds dictionary entries, which
      # would otherwise fail CI on an unchanged tree.
      - uses: crate-ci/typos@v1.50.3

      # SUMMARY.md sets `create-missing = false`, so a listed page with no file is a
      # build error -- but only if something builds the book.
      - uses: taiki-e/install-action@v2
        with:
          tool: mdbook@0.5.4
      - name: mdbook build
        run: mdbook build

  # `rust-version` in Cargo.toml is a promise to anyone building from source. The
  # Tauri crates are excluded: they are built by release CI on stable, never from
  # source by users.
  msrv:
    name: msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read rust-version from Cargo.toml
        id: msrv
        run: echo "version=$(grep -oP '^rust-version *= *"\K[^"]+' Cargo.toml)" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          key: msrv

      - name: Check at the MSRV
        run: cargo check -p domainator-core -p domainator-config -p domainator-cli --all-targets

  upstream-drift:
    name: upstream drift guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # external/domainator is gitignored, so CI clones it at the pin UPSTREAM.md
      # records. If the pin and the vendored copy ever disagree about what the port is
      # caught up to, this job is where that shows up.
      - name: Clone vendored upstream at the recorded pin
        run: |
          PIN=$(grep -oP '\*\*Caught up to:\*\* `\K[0-9a-f]+' UPSTREAM.md)
          echo "pin: $PIN"
          git clone --filter=blob:none https://github.com/nebiolabs/domainator.git external/domainator
          git -C external/domainator checkout "$PIN"

      # The guards below import upstream's `domainator` package -- the shell is
      # rendered by calling into it -- so its own pyproject is the correct dependency
      # list. A hand-picked subset was pinned here until it rotted: `ssn_viewer_html`
      # imports `domainator.utils` for two color constants, and that module pulls in
      # pyhmmer, pyinfernal and requests at import time, none of which the guards use
      # directly. The failure presented as an unrelated ModuleNotFoundError.
      - name: Install upstream's own dependencies
        run: pip install -e external/domainator

      # The viewer shell is a generated artifact; --check fails if it drifted from the
      # Python source it is rendered from.
      - name: Viewer shell drift
        run: python scripts/regen_ssn_viewer_shell.py --check

      # Compares the Rust SSN core against domainator.ssn_edges/ssn_hierarchy field for
      # field. Run at two caps so the merge-event density back-fill is exercised, not
      # just the uncapped path.
      - name: SSN core parity vs Python
        run: |
          M=external/domainator/test/data/FeSOD_dist.dense.hdf5
          for CAP in 500 5; do
            cargo run -q -p domainator-core --example ssn_probe -- "$M" "$CAP" > /tmp/rust.json
            python scripts/ssn_probe.py "$M" --max_merge_events "$CAP" > /tmp/py.json
            python scripts/json_parity.py /tmp/py.json /tmp/rust.json
          done
