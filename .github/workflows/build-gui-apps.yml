name: Build GUI Apps

on:
  workflow_dispatch:
  push:
    # Releases are tagged `vX.Y.Z`, one tag for the CLI and both apps; see
    # docs/development.md, "Versioning and releases".
    tags:
      - "v*"

jobs:
  # A release tag must name the version the binaries report. It comes from
  # `workspace.package.version` alone (CLI `--version`, the GUI About box, job
  # provenance, the installer), so a tag that disagrees ships artifacts whose
  # every self-description contradicts the release page.
  version:
    name: Tag matches workspace version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Compare the tag with Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          want=$(awk '/^\[workspace.package\]/{p=1; next} /^\[/{p=0} p && /^version *=/{gsub(/[" ]/, "", $0); sub(/^version=/, ""); print; exit}' Cargo.toml)
          tag="${GITHUB_REF_NAME}"
          echo "tag: ${tag}  workspace.package.version: ${want}"
          if [ -z "${want}" ] || [ "${tag}" != "v${want}" ]; then
            echo "::error::tag ${tag} does not match workspace.package.version ${want} (expected v${want})"
            exit 1
          fi

  build:
    name: ${{ matrix.app_id }} (${{ matrix.platform }})
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - app_id: genbank-summary
            app_path: apps/genbank-summary
            package_name: domainator-genbank-summary
            platform: macos-arm64
            os: macos-14
            target: aarch64-apple-darwin
            bundle_args: --bundles dmg
            artifact_globs: |
              target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          # - app_id: genbank-summary
          #   app_path: apps/genbank-summary
          #   package_name: domainator-genbank-summary
          #   platform: macos-intel
          #   os: macos-13
          #   target: x86_64-apple-darwin
          #   bundle_args: --bundles dmg
          #   artifact_globs: |
          #     target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
          - app_id: genbank-summary
            app_path: apps/genbank-summary
            package_name: domainator-genbank-summary
            platform: windows-msvc-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundle_args: --bundles nsis
            artifact_globs: |
              target/x86_64-pc-windows-msvc/release/domainator-genbank-summary.exe
              target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          # - app_id: genbank-summary
          #   app_path: apps/genbank-summary
          #   package_name: domainator-genbank-summary
          #   platform: windows-x64
          #   os: ubuntu-24.04
          #   target: x86_64-pc-windows-gnu
          #   bundle_args: --bundles nsis
          #   artifact_globs: |
          #     target/x86_64-pc-windows-gnu/release/domainator-genbank-summary.exe
          #     target/x86_64-pc-windows-gnu/release/bundle/nsis/*.exe

          # ---- domainator-gui (the main Geneious-style GUI) ----
          - app_id: domainator-gui
            app_path: apps/domainator-gui
            package_name: domainator-gui
            platform: macos-arm64
            os: macos-14
            target: aarch64-apple-darwin
            bundle_args: --bundles dmg
            artifact_globs: |
              target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          - app_id: domainator-gui
            app_path: apps/domainator-gui
            package_name: domainator-gui
            platform: windows-msvc-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundle_args: --bundles nsis
            artifact_globs: |
              target/x86_64-pc-windows-msvc/release/domainator-gui.exe
              target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          - app_id: domainator-gui
            app_path: apps/domainator-gui
            package_name: domainator-gui
            platform: linux-x64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundle_args: --bundles deb,appimage
            artifact_globs: |
              target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
              target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
          # Linux -> Windows GNU cross-build (experimental, unsigned; verified to
          # build + bundle an NSIS installer from Ubuntu). Cheaper than a Windows
          # runner, but ship signed MSVC builds. Uncomment to enable.
          # - app_id: domainator-gui
          #   app_path: apps/domainator-gui
          #   package_name: domainator-gui
          #   platform: windows-gnu-x64
          #   os: ubuntu-24.04
          #   target: x86_64-pc-windows-gnu
          #   bundle_args: --bundles nsis
          #   artifact_globs: |
          #     target/x86_64-pc-windows-gnu/release/domainator-gui.exe
          #     target/x86_64-pc-windows-gnu/release/bundle/nsis/*.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ matrix.app_path }}/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Set up MSVC command prompt
        if: matrix.target == 'x86_64-pc-windows-msvc'
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64

      - name: Provide MSVC m.lib compatibility shim
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: |
          $stubDir = Join-Path $env:RUNNER_TEMP 'msvc-empty-m-lib'
          New-Item -ItemType Directory -Force -Path $stubDir | Out-Null
          Set-Content -Path (Join-Path $stubDir 'm_stub.c') -Value 'void __domainator_empty_m_lib(void) {}'
          Push-Location $stubDir
          cl /nologo /c m_stub.c
          lib /nologo /out:m.lib m_stub.obj
          Pop-Location
          "LIB=$stubDir;$env:LIB" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # Tauri v2 on Linux renders through WebKitGTK, and `tauri build` needs the
      # -dev packages plus patchelf to assemble the AppImage. No appindicator
      # packages: neither app declares a `trayIcon`.
      - name: Install Linux GUI build dependencies
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          sudo apt update
          sudo apt install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev librsvg2-dev patchelf \
            build-essential file

      - name: Install Windows GNU cross-build tools
        if: matrix.target == 'x86_64-pc-windows-gnu'
        run: |
          sudo apt update
          sudo apt install -y mingw-w64 nsis

      - name: Cache Cargo registry and build output
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
          key: ${{ matrix.app_id }}-${{ matrix.target }}

      - name: Install frontend dependencies
        working-directory: ${{ matrix.app_path }}
        run: npm ci

      - name: Build app
        working-directory: ${{ matrix.app_path }}
        run: npm run tauri build -- --target ${{ matrix.target }} ${{ matrix.bundle_args }}

      - name: Upload app artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.app_id }}-${{ matrix.platform }}
          if-no-files-found: error
          path: ${{ matrix.artifact_globs }}

  # The GUI installers above carry no command-line tool, but the README sends users to
  # the Releases page for both. These are the pure-Rust crates, so this job needs none
  # of the WebKitGTK stack the GUI build installs.
  cli:
    name: domainator CLI (${{ matrix.platform }})
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            os: ubuntu-latest
            bin: target/release/domainator
          - platform: macos-arm64
            os: macos-14
            bin: target/release/domainator
          - platform: windows-x64
            os: windows-latest
            bin: target/release/domainator.exe
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and build output
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
          key: cli-${{ matrix.platform }}

      - name: Build CLI
        run: cargo build --release -p domainator-cli

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v7
        with:
          name: domainator-cli-${{ matrix.platform }}
          if-no-files-found: error
          path: ${{ matrix.bin }}
